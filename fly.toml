app = "starchart"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  BASE_URL = "https://starchart.fly.dev"
  DATA_DIR = "/data"

[mounts]
  source = "starchart_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the hourly nudge loop (nudges.js) runs inside the server, so a
  # stopped machine would never send nudges.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
