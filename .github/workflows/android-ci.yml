name: Android CI

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional: also cut a release as v<version>, e.g. 0.1.0"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name == 'push' || inputs.release_version == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starchart-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
    uses: ./.github/workflows/android-release.yml
    with:
      version: ${{ inputs.release_version }}
