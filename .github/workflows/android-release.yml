name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (creates tag v<version>)"
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine version
        id: ver
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.ver.outputs.version }}" \
            -PversionCode="${{ steps.ver.outputs.code }}"

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "starchart-v${{ steps.ver.outputs.version }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: starchart-*.apk
          generate_release_notes: true
