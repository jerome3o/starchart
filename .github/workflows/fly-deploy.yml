name: Deploy to Fly.io

on:
  push:
    branches: [main]
    # The Android app and docs don't affect the server image.
    paths-ignore:
      - "android/**"
      - ".github/workflows/android-*.yml"
      - "README.md"
  workflow_dispatch:

# Never run two deploys at once; cancel an in-progress one if a newer push lands.
concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: resolving "latest" needs an unauthenticated GitHub API call
      # that gets rate-limited on shared runners and fails the whole deploy.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          version: 0.4.108

      # Push runtime secrets from GitHub Actions secrets -> Fly (staged, applied
      # by the deploy below). GitHub Actions is the single source of truth.
      - name: Stage runtime secrets on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flyctl secrets set --stage \
            GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            SESSION_SECRET="$SESSION_SECRET" \
            ALLOWED_EMAILS="$ALLOWED_EMAILS"
          # Optional: enables in-app chat and nudges (Claude API).
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            flyctl secrets set --stage ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY"
          fi

      # Persistent volume for the SQLite database (no-op once it exists).
      - name: Ensure data volume exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl volumes list --json | grep -q '"starchart_data"' || \
            flyctl volumes create starchart_data --region iad --size 1 --yes

      # SQLite lives on one volume, so the app must run exactly one machine —
      # Fly's default of two HA machines would need two volumes (split brain).
      - name: Scale to a single machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl scale count 1 --yes

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
